name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        # mypyc compiles the simulation before its tests, minutes on a fresh runner: they get a runner of their own
        part: [tiers, compiled simulation]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: warband
      - name: Resolve committed build inputs
        id: inputs
        working-directory: warband
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pins = json.loads(Path(".github/release-pins.json").read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('sagaforge_commit', 'python', 'uv'):
                  print(f'{key}={pins[key]}', file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ikamensh/sagaforge
          ref: ${{ steps.inputs.outputs.sagaforge_commit }}
          persist-credentials: false
          path: sagaforge
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.inputs.outputs.uv }}
          python-version: ${{ steps.inputs.outputs.python }}
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --extra dev --python "${{ steps.inputs.outputs.python }}"
        working-directory: warband
      - name: Fast tier
        if: matrix.part == 'tiers'
        # every unmarked test, on four workers; one over the budget fails: four workers on a runner run a test about four times slower than a Mac
        run: uv run --locked pytest -q --budget 3 --durations=10
        working-directory: warband
      - name: Slow tier
        if: matrix.part == 'tiers'
        run: uv run --locked pytest -q --slow -m slow --ignore tests/warband/test_fastsim.py --durations=10
        working-directory: warband
      - name: Compiled simulation
        if: matrix.part == 'compiled simulation'
        run: uv run --locked pytest -q --slow tests/warband/test_fastsim.py --durations=10
        working-directory: warband
      - name: Both tiers on the compiled simulation, as the game runs it
        if: matrix.part == 'compiled simulation'
        run: uv run --locked pytest -q --slow --compiled --durations=10
        working-directory: warband
