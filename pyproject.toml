[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warband"
version = "0.2.0"
description = "Warband — a small Warcraft 2-style real-time strategy game on Saga2D"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ilya Kamenshchikov", email = "ilya.kamenshchikov@gmail.com" }]
dependencies = ["saga2d==0.3.8", "sagaforge"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "pytest-xdist>=3.8", "mypy>=2.3.1", "setuptools>=84"]  # mypy brings mypyc, which compiles the simulation (warband/fastsim.py)
package = ["pyinstaller==6.22.2", "pyinstaller-hooks-contrib==2026.7"]

[project.scripts]
warband = "warband.__main__:main"

[tool.uv.sources]
sagaforge = { path = "../sagaforge", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["warband"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist loadgroup"  # four workers for a whole tier; a named file or test runs in one process (tests/conftest.py)
