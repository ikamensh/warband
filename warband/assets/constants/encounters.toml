# Optional army objectives. Rewards are distributed by contribution after lair AND guards fall.
# Fallen guards stay dead. The payout buys a meaningful timing window, without permanent stat buffs.
# `role` names the map job the generator places the encounter for: "expansion" guards a contested
# mine, "choke" holds an optional shortcut with a bypass, "wilds" is a side expedition anywhere.
[wolf_den]
name = "Wolf Pack"
tier = "Raid"
role = "wilds"
roster = ["wolf", "wolf", "wolf", "wolf"]
gold = 1200
lumber = 150
lair_hp = 300
hint = "Shield your ranged troops: the pack hunts exposed archers."

