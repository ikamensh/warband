# Timed conditions a unit carries: what each kind does while it lasts.
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for defaults and validation.
#
# A row is the whole of what a kind does; what lays it on is the rule that names
# it (Rage in the orcs' passive, Bleeding in an archer's shot through units.toml's
# `inflicts`). Laying on a kind a unit already carries restarts its timer: a kind
# never stacks with itself. Different kinds combine: multipliers multiply,
# armour adds. Buildings never carry a condition.
#
#   damage         multiplier on the blows it strikes
#   speed          multiplier on its walking speed
#   blow           multiplier on its wind-up and cooldown (0.8: blows a quarter faster)
#   armor          added to its armour
#   hp_per_second  hit points a second, a drain when negative, through armour; a
#                  death by drain is credited to whoever laid it on
#   duration       seconds it lasts from the last time it was laid on
#   living         only the living take it: never a machine (units.toml `living`)
#   heal_ends      a healer's cast ends it
#   spares         the armour classes it never lands on (unarmoured, light, heavy)
#   roots          it cannot walk while it lasts: it still turns and strikes, and nobody shoves it

[defaults]
damage = 1.0
speed = 1.0
blow = 1.0
armor = 0
hp_per_second = 0.0
living = true
heal_ends = false
roots = false

# An orc soldier hurt below half health, renewed every step it stays there: so it
# runs its full ten seconds after a Shaman mends it, and the orc player wants the
# line hurt and mended both. The card names each kind by its name.
[rage]
name = "Rage"
summary = "Enraged: +25 % damage"
damage = 1.25
duration = 10.0

# Rage once Bloodlust is researched: laid in rage's place, never beside it.
[bloodlust_rage]
name = "Rage"
summary = "Enraged, and Bloodlust doubles it: +50 % damage"
damage = 1.5
duration = 10.0

# An archer's shot that wounds: a fixed drain that does not stack, worth most in
# chases and skirmishes and least in a massed fight. Heavy armour turns the barb:
# a footman, a knight, an ironguard or a bear rider never bleeds. Without that the
# kiting rangers bled heavy melee that could then never close, and the elves won
# the race games out of hand (docs/balance.md, WB-062).
[bleeding]
name = "Bleeding"
summary = "Loses a hit point a second through armour and walks a fifth slower; a heal staunches it; heavy armour is not bled"
speed = 0.8
hp_per_second = -1.0
duration = 5.0
heal_ends = true
spares = ["heavy"]

# -- What the spells lay on (spells.toml `lays`, WB-066) -----------------------------------------------------------
# Magic quickens, stiffens and saps wheels and timber as readily as flesh; only what mends life spares a machine, as a
# healer's cast does.

[haste]
name = "Haste"
summary = "Hasted: 40 % faster, blows a quarter quicker"
speed = 1.4
blow = 0.8
duration = 10.0
living = false

[mend]
name = "Mend"
summary = "Mending: 5 hit points a second"
hp_per_second = 5.0
duration = 6.0

[burn]
name = "Burning"
summary = "Burning: loses 2 hit points a second through armour"
hp_per_second = -2.0
duration = 4.0
living = false

[stoneskin]
name = "Stoneskin"
summary = "Skin of stone: +4 armour"
armor = 4
duration = 15.0
living = false

[entangled]
name = "Entangled"
summary = "Held by roots: cannot move, still strikes"
roots = true
duration = 4.0
living = false

[withered]
name = "Withered"
summary = "Withered: 30 % less damage, 20 % slower"
damage = 0.7
speed = 0.8
duration = 12.0
living = false

[battle_fury]
name = "Battle Fury"
summary = "In a battle fury: 40 % more damage, 20 % faster"
damage = 1.4
speed = 1.2
duration = 12.0
living = false
