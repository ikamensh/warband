# The Aether Vault (WB-063): a cube full of aether, chained to the ground. Standing
# square on a ley rift it draws aether into its owner's store; anywhere else it
# only stores and reaches. How much it stores, how fast it draws and how far it
# reaches are economy.toml's [aether]; the ley rifts themselves are the map's.

[vault]
name = "Aether Vault"
gold = 400
lumber = 200
hp = 500
armor = 3
size = 2
build_time = 35.0
sight = 4
supply = 0
hotkey = "v"
summary = "Draws a rift's aether; holds {store}, reaches {reach} tiles"
requires = "town_hall"

# Nobody's buildings: no race names them, tweaks them or draws them, and no
# hotkey trains from them. The lair wears a building's fortified armour, so a
# siege stone lands on it at x1.5; its hoard is its `gold`, paid out whole to
# whoever brings it down.

[gold_mine]
name = "Gold Mine"
hp = 0
armor = 0
size = 3
build_time = 0.0
sight = 0
supply = 0
hotkey = ""
summary = "Peasants mine gold here"
mine_trip = 100
mine_slots = 8
mine_endless = false

[gold_seam]
name = "Gold Seam"
hp = 0
armor = 0
size = 5
build_time = 0.0
sight = 0
supply = 0
hotkey = ""
# {trip} is filled in from mine_trip below, so the card always says the true number.
summary = "A wide seam that never runs dry: {trip} gold a trip"
mine_trip = 20
mine_slots = 12
mine_endless = true

[lair]
name = "Lair"
hp = 900
armor = 2
size = 3
build_time = 0.0
sight = 4
supply = 0
hotkey = ""
# A den wears a building's fortified armour, so a siege stone lands on it at
# x1.5; its hoard is its gold, paid out whole to whoever brings it down.
summary = "A creature den: its guards come back from it until it is torn down"
