# Warband's buildings: what a hall costs, what a tower shoots, what a mine gives.
#
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for validation.
#
# Conventions: times are seconds, distances tiles. `trains` and `researches`
# name what the building makes; `requires` names the building that must stand
# first (omit it when there is none); `deposits` names what can be delivered
# there. The tower's `damage`, `range` and `cooldown` are its shot; every other
# building leaves them at zero.
#
# The two deposits are buildings too: `mine_trip` is the gold one peasant
# brings up per trip, `mine_slots` how many work the face at once, and
# `mine_endless` whether it ever runs out. The same numbers also feed the
# named constants (GOLD_PER_TRIP and friends) the worker policy prices with,
# so there is one source, not two. The face serves its slots every MINE_TIME
# seconds (a mechanic's timing, kept in rules.py), so a deposit yields at most
# slots * trip / MINE_TIME: 160 gold a second at a mine, 48 at a seam. With
# the walk to the hall on top, a mine next door is saturated by about ten
# peasants and a distant one by a few more: hiring past that earns nothing,
# and the way to more gold is another mine.
#
# What is NOT here: how long construction takes to start (model.py), the
# repair and salvage rates (REPAIR_* and SALVAGE_* in rules.py), and the
# per-race names and stonework (races.toml). The mine's and seam's stocks
# (MINE_GOLD, EXPANSION_GOLD) live with the map generator that places them.

[town_hall]
name = "Town Hall"
gold = 1200
lumber = 800
hp = 1200
armor = 3
size = 3
build_time = 60.0
sight = 6
supply = 5
hotkey = "h"
summary = "Trains peasants; gold and lumber are delivered here; raises the Keep"
trains = ["peasant"]
researches = ["keep"]
deposits = ["gold", "lumber"]

[farm]
name = "Farm"
gold = 500
lumber = 250
hp = 400
armor = 2
size = 2
build_time = 25.0
sight = 3
supply = 4
hotkey = "f"
summary = "Feeds four units"

[barracks]
name = "Barracks"
gold = 700
lumber = 450
hp = 800
armor = 3
size = 3
build_time = 40.0
sight = 5
supply = 0
hotkey = "b"
summary = "Trains footmen and archers"
