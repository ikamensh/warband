# Wild creatures; no race tweaks them. Camp behavior lives in behavior.toml.
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for defaults and validation.
# Seconds, tiles, degrees/second. "melee" uses combat.toml's shared reach.
# Entries override defaults; optional field defaults are listed in docs/balance.md.
# Body radius affects pathing for every race and is never balance-jittered.
# `sound` names each creature's sound family (warband/audio/bodies.py): the wilds have no race to die in the voice of.

[defaults]
armor = 0
range = "melee"
sight = 7
build_time = 0.0
trained_at = "lair"
hotkey = ""

[wolf]
name = "Dire Wolf"
hp = 90
damage = 9
cooldown = 0.9
speed = 4.0
summary = "A pack hunter: fast, fragile and never alone"
radius = 0.4
windup = 0.2
turn_deg = 450
sound = "wolf"

[spider]
name = "Venom Spider"
hp = 120
damage = 10
range = 5.0
cooldown = 1.6
speed = 2.8
summary = "Spits venom from five tiles; helpless once something reaches it"
radius = 0.45
windup = 0.4
sound = "spider"

[troll]
name = "Troll"
hp = 800
damage = 30
cooldown = 1.4
speed = 1.9
sight = 6
summary = "Bare-skinned and hard to put down; knits its wounds back once left alone"
radius = 0.58
windup = 0.45
armor_class = "unarmoured"
regen = 8.0 # hp/second, out of combat
sound = "troll"

[golem]
name = "Stone Golem"
hp = 1050
damage = 40
armor = 4
cooldown = 2.5
speed = 1.3
sight = 5
summary = "Slams the ground: every enemy around its mark is caught"
radius = 0.6
splash = 1.6 # a slam, not aimed siege
windup = 1.8
turn_deg = 150
armor_class = "heavy"
living = false # stone: bleeds for nobody
sound = "golem"

[ancient_guardian]
name = "Ancient Guardian"
hp = 3800
damage = 60
armor = 5
cooldown = 3.2
speed = 1.0
sight = 8
summary = "Dodge its marked ground slam, then strike during recovery; tracking shards defend the air"
radius = 0.85
splash = 2.7
air_range = 6.0
windup = 2.8
turn_deg = 100
armor_class = "heavy"
living = false
sound = "golem"
