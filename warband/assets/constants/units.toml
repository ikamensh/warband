# Workers and soldiers; race modifiers live in races.toml.
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for defaults and validation.
# Seconds, tiles, degrees/second. "melee" uses combat.toml's shared reach.
# Entries override defaults; optional field defaults are listed in docs/balance.md.
# Body radius affects pathing for every race and is never balance-jittered.

[defaults]
armor = 0
range = "melee"
cooldown = 1.0
speed = 2.4
sight = 5

[peasant]
name = "Peasant"
gold = 400
hp = 30
damage = 3
sight = 4
build_time = 12.0
trained_at = "town_hall"
hotkey = "p"
summary = "Mines gold, chops lumber, builds and repairs"
radius = 0.36
windup = 0.25
armor_class = "unarmoured"

[footman]
name = "Footman"
gold = 600
hp = 60
damage = 7
armor = 3
speed = 2.0
build_time = 15.0
trained_at = "barracks"
hotkey = "f"
summary = "Slow shield-wall swordsman; tougher with a comrade at each side"
radius = 0.42
windup = 0.3
armor_class = "heavy"
formation = true

[archer]
name = "Archer"
gold = 500
lumber = 50
hp = 40
damage = 6
