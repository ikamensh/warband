trained_at = "stables"
hotkey = "k"
summary = "Fast, heavily armoured shock cavalry"
radius = 0.56
windup = 0.35
turn_deg = 270
armor_class = "heavy"
mounted = true

[catapult]
name = "Catapult"
gold = 900
lumber = 300
hp = 60
damage = 30
range = 7.0
cooldown = 4.0
speed = 1.6
sight = 6
build_time = 30.0
trained_at = "workshop"
hotkey = "c"
summary = "Slow siege engine: stones land where aimed, splash friend and foe, ×1.5 against buildings"
radius = 0.62
splash = 1.2
windup = 0.8
turn_deg = 150
min_range = 2.0
attack = "siege"
armor_class = "unarmoured"

[flying_machine]
name = "Flying Machine"
gold = 400
lumber = 100
hp = 60
damage = 0 # unarmed: the side's eyes, never a bomb melee could not answer (BACKLOG WB-064)
armor = 2
speed = 4.6
sight = 9
build_time = 18.0
trained_at = "workshop"
hotkey = "m" # M for machine; F is the footman's in the catalogue
summary = "Flies over anything and sees far; unarmed, and only shooters and towers can hit it"
radius = 0.45 # its body among flyers, and what a click picks; it takes no room on the ground
windup = 0.0
armor_class = "unarmoured"
living = false # a machine: no healer mends it
flying = true # straight over trees, water, rock and buildings; out of melee's and a stone's reach

[cleric]
