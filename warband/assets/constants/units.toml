# Workers and soldiers; race modifiers live in races.toml.
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for defaults and validation.
# Seconds, tiles, degrees/second. "melee" uses combat.toml's shared reach.
# Entries override defaults; optional field defaults are listed in docs/balance.md.
# Body radius affects pathing for every race and is never balance-jittered.
# living (default true) and inflicts (a buffs.toml row an archer's wounding shot lays on) are no race's to change.
# A row without `sound` dies in the voice of the race that fields it; a machine names its own family.
#
# The last four are each race's own unit (WB-068, BACKLOG.md): `race` names the one race whose
# building offers it, `requires` the upgrades it waits for (the Keep), `limit` how many a side may
# keep at once, alive and queued together. Each has one mechanic no other unit has: an armed flyer,
# a blow that is its end (`blast`), a walk through the forest (`forest`), a slam that spares its side.

[defaults]
armor = 0
range = "melee"
cooldown = 1.0
speed = 2.4
sight = 5

[peasant]
name = "Peasant"
gold = 400
hp = 30
damage = 3
sight = 4
build_time = 12.0
trained_at = "town_hall"
hotkey = "p"
summary = "Mines gold, chops lumber, builds and repairs"
radius = 0.36
windup = 0.25
armor_class = "unarmoured"

[footman]
name = "Footman"
gold = 600
hp = 60
damage = 7
armor = 3
speed = 2.0
build_time = 15.0
trained_at = "barracks"
hotkey = "f"
summary = "Slow shield-wall swordsman; tougher with a comrade at each side"
radius = 0.42
windup = 0.3
armor_class = "heavy"
formation = true

[archer]
name = "Archer"
gold = 500
lumber = 50
hp = 40
damage = 6
range = 4.0
cooldown = 1.3
sight = 6
build_time = 14.0
trained_at = "barracks"
hotkey = "a"
summary = "Shoots from four tiles away; its wounds bleed; fragile up close"
radius = 0.42
windup = 0.35
attack = "piercing"
inflicts = "bleeding" # a shot that wounds the living opens a wound (buffs.toml)

[knight]
name = "Knight"
gold = 1400
lumber = 200
hp = 90
damage = 10
armor = 4
speed = 3.4
build_time = 20.0
trained_at = "stables"
hotkey = "k"
summary = "Fast, heavily armoured shock cavalry"
radius = 0.56
windup = 0.35
turn_deg = 270
armor_class = "heavy"
mounted = true

[catapult]
name = "Catapult"
gold = 900
lumber = 400
hp = 60
damage = 30
range = 8.0
cooldown = 5.0
speed = 1.4
sight = 6
build_time = 30.0
trained_at = "workshop"
hotkey = "c"
summary = "Slow siege engine: stones land where aimed, splash friend and foe, ×1.5 against buildings"
radius = 0.62
splash = 1.2
windup = 0.8
turn_deg = 150
min_range = 2.0
attack = "siege"
armor_class = "unarmoured"
living = false # a machine: never takes a living condition, never healed
sound = "catapult" # its body's sound family (warband/audio/bodies.py): timbers, not a soldier's cry

[flying_machine]
name = "Flying Machine"
gold = 400
lumber = 100
hp = 60
damage = 0 # unarmed: the side's eyes, never a bomb melee could not answer (BACKLOG WB-064)
armor = 2
speed = 4.6
sight = 9
build_time = 18.0
trained_at = "workshop"
hotkey = "m" # M for machine; F is the footman's in the catalogue
summary = "Flies over anything and sees far; unarmed, and only shooters and towers can hit it"
radius = 0.45 # its body among flyers, and what a click picks; it takes no room on the ground
windup = 0.0
armor_class = "unarmoured"
living = false # a machine: no healer mends it
flying = true # straight over trees, water, rock and buildings; out of melee's and a stone's reach
sound = "flying_machine"

[cleric]
name = "Cleric"
gold = 700
lumber = 50
hp = 40
damage = 3
range = 3.0
cooldown = 2.0
build_time = 20.0
trained_at = "church"
hotkey = "h" # H for healer; L is Blessing
summary = "Heals a wounded ally 15 at a cast; a weak blow when no one needs it"
radius = 0.38
heal = 15
windup = 0.5
armor_class = "unarmoured"

[gryphon]
name = "Gryphon Rider"
gold = 1800
lumber = 400
hp = 110
damage = 14
armor = 2
range = 2.5
cooldown = 1.6
speed = 3.8
sight = 7
build_time = 40.0
trained_at = "stables"
hotkey = "g"
summary = "The armed flyer: hurls a storm hammer at ground and air; only shooters, towers and gryphons reach it"
radius = 0.5 # its body among flyers, and what a click picks; it takes no room on the ground
windup = 0.4
turn_deg = 300
flying = true # over trees, water and walls; out of melee's and a stone's reach
race = "human"
requires = ["keep"]
limit = 3
sound = "gryphon" # a raptor and its rider: no soldier's cry

[sapper]
name = "Goblin Sapper"
gold = 800
lumber = 300
hp = 40
damage = 240 # what the keg does to every rival building in the blast: siege, so x1.5 on a wall
range = "melee"
cooldown = 1.0
speed = 3.4
sight = 5
build_time = 35.0
trained_at = "workshop"
hotkey = "s"
summary = "A runner with a powder keg: its blow is its end, cracking towers and halls, and it spares nobody near"
radius = 0.36
windup = 0.3 # the fuse: a new order, or the target gone, puts it out
armor_class = "unarmoured"
attack = "siege"
blast = 1.5 # tiles round it the keg reaches
blast_units = 60 # what the blast does to every unit on the ground within it, its own side's too
race = "orc"
requires = ["keep"]
limit = 3
sound = "sapper" # its death is its keg going up

[treant]
name = "Treant"
gold = 1500
lumber = 500
hp = 320
damage = 22
armor = 3
cooldown = 1.8
speed = 1.8
build_time = 45.0
trained_at = "church"
hotkey = "t"
summary = "A walking tree: strides through the forest, crushes walls at double, mends among trees out of the fight"
radius = 0.55
windup = 0.5
turn_deg = 180
armor_class = "unarmoured"
attack = "crush"
forest = true # tree tiles are open ground to it
regen = 4.0 # hp/second, out of combat and among trees alone
regen_in_trees = true
race = "elf"
requires = ["keep"]
limit = 3
sound = "treant"

[rune_golem]
name = "Rune Golem"
gold = 1600
lumber = 500
hp = 300
damage = 20
armor = 4
cooldown = 2.4
speed = 1.4
build_time = 45.0
trained_at = "church"
hotkey = "r"
summary = "Carved stone bound by runes: its slam catches every foe round its mark; a construct, it is never mended"
radius = 0.6
splash = 1.3 # a slam, as the wild golem's: the enemies round its mark, never its own side
windup = 0.7
turn_deg = 150
armor_class = "heavy"
living = false # a construct: no healer mends it
race = "dwarf"
requires = ["keep"]
limit = 3
sound = "rune_golem"
