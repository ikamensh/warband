# Warband's economy: what work takes, what stocks the map, what repair costs.
#
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for validation.
#
# The face serves its slots every mine_time, so a deposit yields at most
# slots * trip / mine_time (the trips and slots are buildings.toml's): 160
# gold a second at a mine, 48 at a seam. With the walk to the hall on top, a
# mine next door is saturated by about ten peasants and a distant one by a
# few more: hiring past that earns nothing, and the way to more gold is
# another mine.

[work]
mine_time = 5.0 # seconds a peasant spends inside a deposit per trip
lumber_per_trip = 100
chop_time = 5.0 # seconds to fell a tree

[setup]
mine_gold = 50_000 # a base mine; expansion mines hold expansion_gold, and an endless seam no stock at all
expansion_gold = 30_000
lode_gold = 100_000 # a Mother Lode: the shared ground's prize where the map deals one instead of a seam
starting_gold = 1000
starting_lumber = 500

# Aether (WB-063) is nobody's to carry: it rises from the ley rifts the map
# generator lays down and a finished vault standing square on one draws it
# straight into its owner's store, `every` seconds an aether. The store holds
# `store` for each finished vault, so a lost vault spills what no longer fits.
# `reach` is how far round a finished vault a spell is cast at its plain price
# (WB-066 triples the cost and the cooldown beyond every vault's reach).

[aether]
store = 150 # aether each finished vault holds: a level III spell's 120 within its reach, so one vault casts any spell there
every = 2.0 # seconds a vault on a rift takes to draw one aether; a whole number of simulation steps
reach = 10.0 # tiles round a finished vault's middle

# Mending is repair run at REPAIR_COST of a building's price, pro rata over
# the hit points and charged as the difference of two rounded-up running
# totals, so a repair costs the same however many chunks it is paid in.

[repair]
rate = 8.0 # hit points a peasant mends per second
chunk = 10 # hit points paid for at a time while repairing
cost_share = 0.5 # share of a building's price that mending all of its hit points costs

# Salvage is repair run backwards: a peasant tears hit points out of a
# building and carries the materials home. A ruin nobody holds comes apart at
# the rate one is mended at; a building someone still holds resists, and comes
# apart at a quarter of it, which is why a peasant crew is never a siege
# engine (a catapult puts about fourteen hit points a second into a building
# from seven tiles away, a salvaging peasant two from arm's length).

[salvage]
rate = 8.0 # hit points a peasant tears out of a ruin per second
held_rate = 2.0 # hit points a second out of a building its owner still holds
chunk = 10 # hit points torn out at a time, each paid out on its own
share = 0.25 # share of a building's price that tearing all of its hit points out returns
