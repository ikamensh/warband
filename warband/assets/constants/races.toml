town_hall = { name = "Deep Hold", card = "Hold", summary = "Trains miners; takes gold and lumber" }
farm = { name = "Brewhouse", card = "Brewery", summary = "Feeds four units" }
barracks = { name = "Guard Hall", card = "Barracks", summary = "Trains ironguards and crossbowmen" }
tower = { name = "Bolt Tower", card = "Tower", summary = "Shoots at enemies six tiles away" }
lumber_mill = { name = "Timber Works", card = "Timber", summary = "Takes lumber; researches better bolts" }
blacksmith = { name = "Forge", card = "Forge", summary = "Researches axes, plate and Deep Mining" }
