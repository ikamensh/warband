[elf.units]
defaults = { hp_mult = 0.95, speed_add = 0.15, sight_add = 2 }
peasant = { name = "Gatherer", summary = "Mines gold, fells trees, builds and repairs" }
footman = { name = "Sentinel", summary = "Light swordsman in a line; quick on their feet" }
archer = { name = "Ranger", summary = "Shoots from five tiles; its wounds bleed; fragile up close", range_add = 1.0 }
knight = { name = "Stag Knight", summary = "Antlered shock cavalry, swift but light" }
catapult = { name = "Ballista", summary = "Living-wood siege engine: splash, ×1.5" }
flying_machine = { name = "Leafwing Glider", summary = "Living-wood frame on leaf wings; sees farthest, unarmed" }
cleric = { name = "Druid", summary = "Tends wounded allies; stings weakly when none need tending" }
treant = { name = "Treant", summary = "Walking tree: through the forest, x2 on walls, mends among trees" }

[elf.buildings]
town_hall = { name = "Moon Hall", card = "Hall", summary = "Trains gatherers; takes gold and lumber" }
farm = { name = "Orchard", card = "Orchard", summary = "Feeds four units" }
barracks = { name = "Warden Lodge", card = "Lodge", summary = "Trains sentinels and rangers" }
tower = { name = "Watch Tree", card = "Eyrie", summary = "Shoots at enemies six tiles away" }
lumber_mill = { name = "Grove Mill", card = "Mill", summary = "Takes lumber; arrows, Longbows and Regrowth" }
blacksmith = { name = "Silversmith", card = "Smith", summary = "Researches keener blades and silver mail" }
stables = { name = "Stag Pens", card = "Pens", summary = "Trains stag knights" }
workshop = { name = "Siege Bower", card = "Bower", summary = "Builds ballistae and gliders; siege upgrades" }
church = { name = "Moonwell", card = "Moonwell", summary = "Trains druids and treants" }
vault = { name = "Moon Reliquary", card = "Relic", summary = "Gathers a rift's aether; holds {store}, reaches {reach} tiles" }
mage_tower = { name = "Starwell Spire", card = "Starwell", summary = "Draws down spells, cast with aether" }

[elf.upgrades]
keep = { name = "Moonspire", card = "Moonspire" }

[dwarf]
