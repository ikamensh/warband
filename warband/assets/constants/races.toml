# Race differences from units.toml / buildings.toml; prices and hotkeys stay shared.
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for defaults and validation.
# Each units/buildings table has optional defaults; individual values override them.
# Omitted modifiers: *_mult = 1, *_add = 0, formation = true (keep the base setting).
# A race names its own unit (units.toml `race`) and no other race's; its defaults apply to it too.
# range_add affects ranged units only; formation = false opts out of shield walls.
# Passive mechanics live in sim/model.py; art lives in art/textures.py.

[human]
name = "Humans"
adjective = "Human"
tagline = "Drilled, balanced, and blessed with the fastest horses"
passive = "Drill: every unit trains 15 % faster"
arts = ["horses", "blessing"]

[human.units]
defaults = { build_time_mult = 0.85 }
peasant = { name = "Peasant", summary = "Mines gold, chops lumber, builds, repairs" }
footman = { name = "Footman", summary = "Slow shield-wall swordsman; tougher with a comrade at each side" }
archer = { name = "Archer", summary = "Shoots from four tiles; its wounds bleed; fragile up close" }
knight = { name = "Knight", summary = "Fast, heavily armoured shock cavalry" }
catapult = { name = "Catapult", summary = "Siege engine: splash, ×1.5 vs buildings" }
flying_machine = { name = "Flying Machine", summary = "Rotor-borne eyes over any ground; unarmed, only shooters hit it" }
cleric = { name = "Cleric", summary = "Heals wounded allies; smites weakly when none need healing" }
gryphon = { name = "Gryphon Rider", summary = "Armed flyer: storm hammer at ground and air; only shooters reach it" }

[human.buildings]
town_hall = { name = "Town Hall", card = "Hall", summary = "Trains peasants; takes gold and lumber" }
farm = { name = "Farm", card = "Farm", summary = "Feeds four units" }
barracks = { name = "Barracks", card = "Barracks", summary = "Trains footmen and archers" }
tower = { name = "Guard Tower", card = "Tower", summary = "Shoots at enemies six tiles away" }
lumber_mill = { name = "Lumber Mill", card = "Mill", summary = "Takes lumber; researches better arrows" }
blacksmith = { name = "Blacksmith", card = "Smith", summary = "Researches sharper blades and plate armour" }
stables = { name = "Stables", card = "Stables", summary = "Trains knights and gryphon riders; breeds horses" }
workshop = { name = "Workshop", card = "Workshop", summary = "Builds catapults and flying machines; siege upgrades" }
church = { name = "Church", card = "Church", summary = "Trains clerics; blesses their healing" }
vault = { name = "Arcane Vault", card = "Vault", summary = "Draws a rift's aether; holds {store}, reaches {reach} tiles" }
mage_tower = { name = "Mage Tower", card = "Arcanum", summary = "Researches spells, cast with aether" }

[human.upgrades]
keep = { name = "Keep", card = "Keep" }

[orc]
name = "Orcs"
adjective = "Orcish"
tagline = "Tough, savage, and deadliest when wounded"
passive = "Rage: soldiers below half health rage for 10 s, +25 % damage, healed or not"
arts = ["bloodlust", "plunder"]

[orc.units]
defaults = { hp_mult = 1.1 }
peasant = { name = "Peon", summary = "Digs gold, hacks lumber, builds and repairs" }
footman = { name = "Grunt", summary = "Brutal axeman, fast and alone; rages when wounded", damage_mult = 1.1, armor_add = -1, speed_add = 0.4, formation = false }
archer = { name = "Axethrower", summary = "Throws axes four tiles; its wounds bleed; sturdy" }
knight = { name = "Ogre", summary = "Two-headed brute; thin armour, all rage", hp_mult = 1.2, damage_mult = 1.1, armor_add = -1 }
catapult = { name = "Catapult", summary = "Skulled siege engine: splash, ×1.5 vs walls" }
flying_machine = { name = "Goblin Zeppelin", summary = "Patched balloon, goblin at the rail; sees all, fights nothing" }
cleric = { name = "Shaman", summary = "Mends wounded allies; hexes weakly when none need mending" }
sapper = { name = "Goblin Sapper", summary = "Powder keg on legs: blows up towers and halls, and itself; {blast_units} to all beside it, yours too" }

[orc.buildings]
town_hall = { name = "Great Hall", card = "Hall", summary = "Trains peons; takes gold and lumber" }
farm = { name = "Pig Farm", card = "Pig Farm", summary = "Feeds four units" }
barracks = { name = "War Camp", card = "War Camp", summary = "Trains grunts and axethrowers" }
tower = { name = "Watch Tower", card = "Tower", summary = "Hurls axes at enemies six tiles away" }
lumber_mill = { name = "Sawmill", card = "Sawmill", summary = "Takes lumber; researches heavier axes" }
blacksmith = { name = "Forge", card = "Forge", summary = "Researches blades, hide armour, Bloodlust" }
stables = { name = "Kennels", card = "Kennels", summary = "Trains ogres; Plunder" }
workshop = { name = "Siege Yard", card = "Yard", summary = "Builds catapults, zeppelins and sappers; siege upgrades" }
church = { name = "Altar", card = "Altar", summary = "Trains shamans" }
vault = { name = "Spirit Cage", card = "Cage", summary = "Cages a rift's aether; holds {store}, reaches {reach} tiles" }
mage_tower = { name = "Spirit Lodge", card = "Spirits", summary = "Calls up spells, cast with aether" }

[orc.upgrades]
keep = { name = "Stronghold", card = "Stronghold" }

[elf]
name = "Elves"
adjective = "Elven"
tagline = "Swift, far-sighted, and at home among the trees"
