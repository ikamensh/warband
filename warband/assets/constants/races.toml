footman = { name = "Ironguard", summary = "Armoured axeman in a wall of round shields", armor_add = 1 }
archer = { name = "Crossbowman", summary = "Shoots from four tiles; its wounds bleed; hardy" }
knight = { name = "Bear Rider", summary = "Armoured shock cavalry on a war bear" }
catapult = { name = "Mortar", summary = "Iron mortar: wide splash, ×1.5 vs buildings" }
flying_machine = { name = "Gyrocopter", summary = "Steam rotor over any ground; eyes, not guns: only shooters hit it" }
cleric = { name = "Runepriest", summary = "Heals wounded allies; strikes weakly when none need healing" }
rune_golem = { name = "Rune Golem", summary = "Runed stone: slams every foe round its mark; never mended" }

[dwarf.buildings]
