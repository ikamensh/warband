# Warband's upgrades: what research costs, how long it takes, who may buy it.
#
# Read once at startup. Edit and restart to use new values; no generation step.
# See docs/balance.md for validation.
#
# Conventions: `time` is seconds. `requires` names the upgrades (and, by
# convention, the Keep) that must be researched first; omit it when there are
# none. `race` names the one race that may research a race art; omit it for
# the shared ladder every race climbs. `card` is the short name on the
# command-card button; `hotkey` its key.
#
# What is NOT here: what an upgrade DOES (the *_BONUS constants in rules.py,
# applied in model.py: blades add BLADES_BONUS damage, plate adds ARMOR_BONUS
# armour, and so on). A price change lives here; an effect change lives there.

[keep]
name = "Keep"
gold = 1500
lumber = 800
time = 90.0
hotkey = "k"
card = "Keep"
summary = "Raises the hall, opening the upper tiers"

[blades_1]
name = "Sharpened Blades"
gold = 500
lumber = 100
time = 40.0
hotkey = "b"
card = "Blades I"
summary = "+2 damage for melee units"

[blades_2]
name = "Tempered Blades"
gold = 1500
lumber = 300
time = 60.0
hotkey = "b"
card = "Blades II"
summary = "+2 more damage for melee units"
requires = ["blades_1", "keep"]

