# -- What research does -------------------------------------------------------
# Each upgrade's effect, applied in model.py. Prices are above; magnitudes
# here. The master weapons are worth two of the tiers below them, for well
# over twice their price and twice their hour. Keep the summaries above in
# sync with these: they promise "+2 damage" and "half again" in words, and a
# moved number without its words is a card that lies.

[effects]
blades_bonus = 2 # added damage for melee units per tier (master tiers add master_weapon_bonus instead)
master_weapon_bonus = 4
armor_bonus = 1 # added armour for soldiers per tier
arrows_bonus = 2 # added damage for archers and towers per tier (master tiers add master_weapon_bonus instead)
horses_bonus = 0.8 # added speed for knights
siege_range_bonus = 1.0 # added range for siege engines
siege_damage_bonus = 1.25 # damage multiplier for siege engines
blessing_bonus = 1.5 # multiplier on a cleric's healing
plunder_share = 0.2 # of a razed building's gold cost (the card says "a fifth")
longbows_bonus = 1.0 # added range for rangers and towers
regrowth_seconds = 60.0 # after a minute, trees felled by elves grow back
deep_mining_trip = 150 # gold per trip with Deep Mining
blasting_powder_bonus = 1.5 # multiplier on a mortar's splash
