# Warband's neutrals: the wild creatures that guard the contested deposits.
#
# This is the file to edit to change what a creature costs (nothing: nobody
# trains them), how hard it hits and how long it takes to bring down. After
# editing, run from the repository root:
#
#     uv run python tools/balance_tables.py
#
# which rewrites the WILD_UNITS table in warband/sim/rules.py (marked
# GENERATED there; never edit that region by hand).
# tests/warband/test_balance_tables.py fails until the two agree, so a tuned
# checkout cannot be committed half-applied.
#
# Conventions are units.toml's: times are seconds, distances tiles,
# `range = "melee"` is the shared melee reach, `turn_deg` degrees per second.
# Nobody trains these and no race names or tweaks them (races.toml holds the
# seven player roles alone), so their numbers are used as they stand. No
# hotkey, no build time, trained "at" the lair for form's sake. Each is chosen
# for a unit the balance data says is dead weight, and each is a shape the
# roster does not already own (docs/warband-monsters.md).
#
# What is NOT here: where camps stand and how they reset (behavior.toml's
# [camps], warband/sim/camps.py), and the player units (units.toml).

