# Warband's races: what differs on top of the shared skeleton.
#
# This is the file to edit to rename a race's units, retune its edge, or move
# an art. After editing, run from the repository root:
#
#     uv run python tools/balance_tables.py
#
# which rewrites the matching tables in warband/sim/races.py (marked GENERATED
# there; never edit those regions by hand). tests/warband/test_balance_tables.py
# fails until the two agree, so a tuned checkout cannot be committed half-applied.
#
# Every race fields the same seven roles from the same nine buildings with the
# same hotkeys and costs (units.toml, buildings.toml), so the AI, the
# settlement planner, saves and the online protocol never care who is playing.
# A unit entry here tweaks the shared role: `hp_mult`, `damage_mult` and
# `build_time_mult` multiply the base value, `armor_add`, `range_add`,
# `speed_add` and `sight_add` add to it (`range_add` only matters for ranged
# units), and `formation = false` opts a unit out of the shield-wall line.
# A building entry renames it and multiplies its hit points (`hp_mult`) or
# adds armour (`armor_add`). An upgrade entry only renames it (upgrades.toml
# holds the price); only the Keep is renamed so far.
#
# What is NOT here: the passive mechanics themselves (Drill, Frenzy, keen
# eyes, Stonework are applied in model.py from the *_BONUS constants in
# rules.py). The human `build_time_mult = 0.85` below IS Drill; the orc
# toughness here is the half of Frenzy you can see on the card. The look of
# every unit and building lives in warband/art/textures.py.

