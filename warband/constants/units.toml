# Warband's units: every soldier and worker in one place.
#
# This is the file to edit to change what a unit costs, how hard it hits and
# how fast it trains. After editing, run from the repository root:
#
#     uv run python tools/balance_tables.py
#
# which rewrites the UNITS table in warband/sim/rules.py (marked GENERATED
# there; never edit that region by hand). tests/warband/test_balance_tables.py
# fails until the two agree, so a tuned checkout cannot be committed half-applied.
#
# Conventions: times are seconds, distances tiles. `range = "melee"` is the
# shared melee reach (combat.toml: a blow from the next tile over, diagonals
# included); anything else is a distance in tiles. `turn_deg` is degrees per
# second. Costs are `gold` and `lumber` (omit lumber when it is zero).
#
# What is NOT here: how a blow lands (warband/sim/model.py), what an upgrade
# adds to a stat (upgrades.toml's [effects]), the per-race tweaks
# (races.toml: orc hit points, elf speed, dwarf armour), and the neutral
# creatures (neutrals.toml: nobody trains them, no race names them).
# The body `radius` is shared by every race and never jittered by balance
# variants (rules.MAX_UNIT_RADIUS); changing one moves pathing and combat for
# every army, so think twice.

